---
# Derived facts for networking role
networking_ingress_iface: "{{ ingress_iface if ingress_iface is string else ingress_iface[0] }}"

# FreeBSD: the interface the role configures and restarts when that changes.
# GRE mode always names the tunnel gif0.
networking_data_iface: "{{ 'gif0' if ingress_mode == 'gre' else networking_ingress_iface }}"

# FreeBSD GRE: the outer source and destination of gif0's tunnel, IPv4 or IPv6
# by gre_outer_proto (gif(4) carries either; the inner side is always IPv6).
networking_gre_tunnel: >-
  {{ [gre_local_ip4, gre_remote_ip4] if gre_outer_proto == 'ipv4' else [gre_local_ip6, gre_remote_ip6] }}

# FreeBSD: per interface, the settings this role writes to rc.conf for it. A
# restart applies them, and networking_netif_state_file records what the last
# successful converge applied: an interface whose entry differs is restarted.
networking_netif_desired: >-
  {{ {networking_data_iface:
        ('gre ' ~ (networking_gre_tunnel | join(' ')) ~ ' ' ~ gre_inner_ipv6)
        if ingress_mode == 'gre'
        else ('ethernet ' ~ ((ingress_dhcp4 | default(true)) | bool | ternary('DHCP', 'up')))} }}
networking_netif_state_file: /var/db/retry-endpoint-netif.json

# FreeBSD: the multicast route resolves to ff02::/16, which rc.d/routing reserves
# with a reject route at every boot ("ff02::/16 ::1 -reject"), so no route for it
# can be installed. Compared by value: a /16 is fixed by its first group, so any
# spelling of ff02::/16 counts, and a narrower ff02 prefix does not.
networking_mc_route_link: >-
  {{ (networking_mc_route_prefix | trim | lower) is match('^ff02:[0-9a-f:.]*/0*16$') }}

# Auto-derive multicast route prefix from mc_scope if mc_route_prefix is not set.
# `mc_route_prefix` is optional: default to '' to keep the ternary safe.
networking_mc_route_prefix: >-
  {{ mc_route_prefix if (mc_route_prefix | default('') | length) > 0 else
  ('ff02::/16' if mc_scope == 'link' else
  'ff05::/16' if mc_scope == 'site' else
  'ff08::/16' if mc_scope == 'org' else
  'ff0e::/16') }}
