---
# Disk hygiene
# ------------------------------------------------------------
# Fabric/edge nodes run an 8.7G root. Three things fill it, none of them fast
# enough to notice and all of them unbounded:
#
#   - the apt archive cache, which a dist-upgrade refills by ~1.4G per kernel bump
#     and `autoclean` does NOT empty (it only drops .debs the repo no longer has);
#   - the journal, capped by nothing but its 10%-of-filesystem default;
#   - /tmp/gopath + /tmp/gocache, ~780M left behind by the on-node Go builds in the
#     shard-proxy / shard-listener / retry-endpoint roles.
#
# On 2026-08-11 a single fleet-wide converge took all 8 fabric nodes from 2.8G free
# to 1.4G and tripped NodeDiskLow across the fabric at once. The converge-time fixes
# (apt clean in os_update.yml, the Clean Go build caches handler) only run when a
# converge runs, which is exactly the assumption that failed — so the same reclaims
# also run on a timer, independent of anyone deploying anything.
common_disk_maintenance: true
common_disk_maintenance_oncalendar: "daily"
# Spread across nodes so a fabric's worth of timers does not fire in lockstep; the
# reclaim is I/O on the root disk of a forwarding node.
common_disk_maintenance_splay_sec: 3600
# The timer must never delete a cache a converge is actively building against. It
# skips any tree with a file modified inside this window, which also makes it a
# no-op on nodes that converge more often than it fires.
common_gocache_max_age_days: 7
# journald's own ceiling. SystemKeepFree is the second guard: it yields disk back
# even when the journal is under SystemMaxUse but the filesystem is nearly full.
common_journal_max_use: "300M"
common_journal_keep_free: "1G"
common_journal_max_retention: "2week"
