# Copy to hosts.yml and customize for your deployment

retry_endpoint_nodes:
  hosts:
    retry-endpoint-1:
      ansible_host: 10.0.3.10
      ingress_iface: eth0
      mgmt_cidrs_v4:
        - 10.0.0.0/8

