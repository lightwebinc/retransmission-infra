---
# Retry-endpoint networking. Receives multicast frames + unicast NACKs;
# retransmits via multicast. Forwarding stays disabled (see docs/security.md).

- name: Set IPv6 RA + MLDv2 sysctls
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/60-retry-endpoint.conf
    reload: true
  loop:
    - { name: net.ipv6.conf.all.accept_ra, value: "1" }
    - { name: "net.ipv6.conf.{{ networking_ingress_iface }}.accept_ra", value: "1" }
    # MLDv2 + raised mld_max_msf: required when retry-endpoint runs in
    # sourceMode=ssm (consumes the manifest source-set for data-plane
    # (S,G) joins). Default 64 sources/socket is below production
    # publisher count; raise via networking_mld_max_msf (default 1024
    # ≈ 2× expected fleet). See bsv-multicast SSM Support Plan.
    - { name: net.ipv6.conf.all.force_mld_version, value: "2" }
    - { name: net.ipv6.mld_max_msf, value: "{{ networking_mld_max_msf | default('1024') }}" }

- name: Deploy netplan config for ethernet ingress
  ansible.builtin.template:
    src: netplan-ethernet.yaml.j2
    dest: /etc/netplan/60-retry-endpoint.yaml
    owner: root
    group: root
    mode: "0600"
  when:
    - ingress_mode == 'ethernet'
    - manage_netplan | default(true) | bool
  notify: Apply netplan

- name: Deploy netplan config for GRE6 tunnel ingress
  ansible.builtin.template:
    src: netplan-gre.yaml.j2
    dest: /etc/netplan/61-retry-endpoint-gre.yaml
    owner: root
    group: root
    mode: "0600"
  when:
    - ingress_mode == 'gre'
    - manage_netplan | default(true) | bool
  notify: Apply netplan

- name: Apply multicast route on ingress interface (Linux)
  ansible.builtin.command:
    argv:
      - ip
      - -6
      - route
      - replace
      - "{{ networking_mc_route_prefix }}"
      - dev
      - "{{ networking_ingress_iface }}"
  register: networking_mc_route_result
  changed_when: networking_mc_route_result.rc == 0
  failed_when: false
