---
- name: Create retry-endpoint system group
  ansible.builtin.group:
    name: "{{ retry_group }}"
    system: true
    state: present

- name: Create retry-endpoint system user
  ansible.builtin.user:
    name: "{{ retry_user }}"
    group: "{{ retry_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ retry_install_dir }}"
    create_home: false
    state: present

- name: Create retry-endpoint install directory
  ansible.builtin.file:
    path: "{{ retry_install_dir }}"
    state: directory
    owner: "{{ retry_user }}"
    group: "{{ retry_group }}"
    mode: "0755"

- name: Mark install directory as git safe.directory
  community.general.git_config:
    name: safe.directory
    scope: global
    value: "{{ retry_install_dir }}"

- name: Clone / update retry-endpoint repository
  ansible.builtin.git:
    repo: "{{ retry_repo }}"
    dest: "{{ retry_install_dir }}"
    version: "{{ retry_version }}"
    force: false
  register: retry_clone
  when: retry_local_binary | default('') | length == 0

- name: Push pre-built retry-endpoint binary (skips git/build)
  ansible.builtin.copy:
    src: "{{ retry_local_binary }}"
    dest: "{{ retry_install_dir }}/retry-endpoint"
    owner: "{{ retry_user }}"
    group: "{{ retry_group }}"
    mode: "0755"
  when: retry_local_binary | default('') | length > 0

# A pushed binary was not built here, so the build record no longer describes it.
- name: Drop the build record for a pushed binary
  ansible.builtin.file:
    path: "{{ retry_install_dir }}/.built-ref"
    state: absent
  when: retry_local_binary | default('') | length > 0

- name: Set ownership of install directory after clone
  ansible.builtin.file:
    path: "{{ retry_install_dir }}"
    owner: "{{ retry_user }}"
    group: "{{ retry_group }}"
    recurse: true
  when: retry_local_binary | default('') | length == 0

- name: Stat existing retry-endpoint binary in install dir
  ansible.builtin.stat:
    path: "{{ retry_install_dir }}/retry-endpoint"
  register: retry_binary_stat
  when: retry_local_binary | default('') | length == 0

- name: Read the installed Go toolchain version
  ansible.builtin.command: "{{ go_install_dir }}/bin/go env GOVERSION"
  environment:
    GOTOOLCHAIN: local
  register: retry_go_installed
  changed_when: false
  check_mode: false
  failed_when: false
  when: retry_local_binary | default('') | length == 0

# A run limited by tags skips the common role, which installs Go. Building
# with another release would miss the pinned toolchain and rebuild every run.
- name: Require the pinned Go toolchain for source builds
  ansible.builtin.assert:
    that:
      - retry_go_installed.stdout | default('') | trim == 'go' ~ go_version
    fail_msg: >-
      {{ go_install_dir }} holds {{ retry_go_installed.stdout | default('no Go') }},
      not go{{ go_version }}. Run the common role first (the play without tags, or with the common tag).
  # A dry run installs nothing, so the toolchain it reads may be the one about to be replaced.
  when:
    - retry_local_binary | default('') | length == 0
    - not ansible_check_mode

- name: Read the Go version the existing binary was built with
  ansible.builtin.command: "{{ go_install_dir }}/bin/go version {{ retry_install_dir }}/retry-endpoint"
  register: retry_binary_go
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - retry_local_binary | default('') | length == 0
    - retry_binary_stat.stat.exists

# A branch name stays the same while its commit moves, so the record carries both.
# A dry run leaves the checkout alone: there the commit is the one the clone task predicts.
- name: Read the checked-out commit
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ retry_install_dir }}"
  register: retry_head
  changed_when: false
  check_mode: false
  failed_when: false
  when: retry_local_binary | default('') | length == 0
  tags: [skip_ansible_lint]

- name: Read the release and commit the existing binary was built from
  ansible.builtin.command: "cat {{ retry_install_dir }}/.built-ref"
  register: retry_built_ref
  changed_when: false
  check_mode: false
  failed_when: false
  when:
    - retry_local_binary | default('') | length == 0
    - retry_binary_stat.stat.exists

# A binary built with another Go release, or from another release or commit of
# the source, is rebuilt: a toolchain move or a version pin move reaches a
# deployed node without retry_force_build.
- name: Decide whether the binary is rebuilt
  ansible.builtin.set_fact:
    retry_rebuild: >-
      {{ not retry_binary_stat.stat.exists
      or (retry_force_build | default(false) | bool)
      or (retry_binary_go.stdout | default('')).split() | last | default('') != 'go' ~ go_version
      or (retry_built_ref.stdout | default('')) | trim != retry_version ~ ' ' ~
      (retry_clone.after | default(retry_head.stdout | default(''), true) | trim) }}
  when: retry_local_binary | default('') | length == 0

# Dropped first, so a run that stops between the build and the record rebuilds next time.
- name: Drop the build record before a rebuild
  ansible.builtin.file:
    path: "{{ retry_install_dir }}/.built-ref"
    state: absent
  when:
    - retry_local_binary | default('') | length == 0
    - retry_rebuild | bool

- name: Build retry-endpoint binary
  ansible.builtin.command:
    # Folded scalar: the one-line form ran past the 160-char lint limit. Folding
    # joins these lines with single spaces, so the command string is unchanged.
    cmd: >-
      {{ go_install_dir }}/bin/go build -buildvcs=false
      -ldflags "-s -w -X github.com/lightwebinc/retry-endpoint/metrics.Version={{ retry_version }}"
      -o {{ retry_install_dir }}/retry-endpoint .
    chdir: "{{ retry_install_dir }}"
  environment:
    PATH: "{{ go_install_dir }}/bin:{{ ansible_env.PATH }}"
    CGO_ENABLED: "0"
    GOTOOLCHAIN: local
    GOOS: "{{ 'freebsd' if ansible_os_family == 'FreeBSD' else 'linux' }}"
    GOARCH: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
    HOME: "/tmp"
    GOPATH: "/tmp/gopath"
    GOCACHE: "/tmp/gocache"
  changed_when: true
  when:
    - retry_local_binary | default('') | length == 0
    - retry_rebuild | bool

- name: Record the release and commit the binary was built from
  ansible.builtin.copy:
    content: "{{ retry_version }} {{ retry_clone.after | default(retry_head.stdout | default(''), true) | trim }}\n"
    dest: "{{ retry_install_dir }}/.built-ref"
    owner: "{{ retry_user }}"
    group: "{{ retry_group }}"
    mode: "0644"
  when: retry_local_binary | default('') | length == 0

- name: Set ownership on pushed/built binary
  ansible.builtin.file:
    path: "{{ retry_install_dir }}/retry-endpoint"
    owner: "{{ retry_user }}"
    group: "{{ retry_group }}"
    mode: "0755"

- name: Install binary to system bin dir
  ansible.builtin.copy:
    src: "{{ retry_install_dir }}/retry-endpoint"
    dest: "{{ retry_bin_dir }}/retry-endpoint"
    remote_src: true
    owner: root
    group: "{{ retry_group }}"
    mode: "0755"
  notify: Restart retry-endpoint

- name: Create config directory
  ansible.builtin.file:
    path: "{{ '/usr/local/etc' if ansible_os_family == 'FreeBSD' else '/etc/retry-endpoint' }}"
    state: directory
    owner: root
    group: "{{ retry_group }}"
    mode: "0750"

- name: Deploy environment config file
  ansible.builtin.template:
    src: config.env.j2
    dest: "{{ '/usr/local/etc/retry-endpoint.conf' if ansible_os_family == 'FreeBSD' else '/etc/retry-endpoint/config.env' }}"
    owner: root
    group: "{{ retry_group }}"
    mode: "0640"
  notify: Restart retry-endpoint

- name: Deploy systemd service unit (Linux)
  ansible.builtin.template:
    src: retry-endpoint.service.j2
    dest: /etc/systemd/system/retry-endpoint.service
    owner: root
    group: root
    mode: "0644"
  when: ansible_os_family != 'FreeBSD'
  notify:
    - Reload systemd
    - Restart retry-endpoint

- name: Deploy rc.d service script (FreeBSD)
  ansible.builtin.template:
    src: retry_endpoint.rc.j2
    dest: /usr/local/etc/rc.d/retry_endpoint
    owner: root
    group: wheel
    mode: "0755"
  when: ansible_os_family == 'FreeBSD'
  notify: Restart retry-endpoint

- name: Enable and start retry-endpoint (Linux)
  ansible.builtin.systemd:
    name: retry-endpoint
    enabled: true
    state: started
  when: ansible_os_family != 'FreeBSD'

- name: Enable retry-endpoint in rc.conf (FreeBSD)
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^retry_endpoint_enable='
    line: 'retry_endpoint_enable="YES"'
  when: ansible_os_family == 'FreeBSD'

- name: Start retry-endpoint (FreeBSD)
  ansible.builtin.service:
    name: retry_endpoint
    state: started
  when: ansible_os_family == 'FreeBSD'
